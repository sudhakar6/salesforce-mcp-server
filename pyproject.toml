[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salesforce-mcp-server"
version = "0.1.0"
description = "An independent, open-source MCP server for Salesforce (REST, Bulk API 2.0, Composite) — not a Salesforce product."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "grpcio>=1.66",
    "protobuf>=5",
    "fastavro>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]
# Only needed to regenerate src/salesforce_mcp/pubsub/pubsub_api_pb2*.py from
# the vendored .proto (see scripts/generate_pubsub_stubs.sh) — not required
# to run or test the server; the generated stubs are committed.
codegen = [
    "grpcio-tools>=1.66",
]

[project.scripts]
salesforce-mcp-server = "salesforce_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salesforce_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Machine-generated from pubsub_api.proto (see scripts/generate_pubsub_stubs.sh) — not hand-edited, not linted.
extend-exclude = ["src/salesforce_mcp/pubsub/pubsub_api_pb2*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

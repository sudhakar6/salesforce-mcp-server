[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salesforce-mcp-server"
version = "0.1.0"
description = "An independent, open-source MCP server for Salesforce (REST, Bulk API 2.0, Composite) — not a Salesforce product."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
salesforce-mcp-server = "salesforce_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salesforce_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
